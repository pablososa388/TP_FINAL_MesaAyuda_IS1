<!DOCTYPE html>
<!-- resetPassword.html : pantalla para cambiar la password de un cliente -->

<html Lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Cambio de password</title>

        <style type="text/css"> 
            label { 
              font-size: 18px; 
            } 
            form {
                width: 500px;
                border: 1px solid black; 
            }
            input { 
              margin: 7px; 
              padding: 2px 
            } 
            .form-label{
                margin-bottom:0!important;
            }     
            .txt {
                display: inline-block;
                width: 80%;
                outline: none;
                margin:0;
            }
        </style> 
    </head>
<body>
    <center><img src="HelpDeskGirl.png" alt="Nuestra imagen corporativa" style="width:200px;height:150px;"></center>
    <center>
        <h1>Sistema de Mesa de Ayuda</h1>
        <h2>Cambiar contraseña</h2>
    </center>

    <center>
    <form class="form" method="GET" style="background-color:#d8f7cf" width="100px" border="1">
        <br>
        <table>
            <tr><td><label class="form-label">E-Mail</label></td></tr>
            <tr><td><input class="txt" name="contacto" type="email" placeholder="Correo electrónico"><br></td></tr>
            <tr><td>&nbsp;</td></tr>
            <tr><td><label class="form-label">Nueva contraseña</label></td></tr>
            <tr><td><input class="txt" name="password1" type="password" placeholder="Nueva contraseña"><br></td></tr>
            <tr><td>&nbsp;</td></tr>
            <tr><td><label class="form-label">Repetir nueva contraseña</label></td></tr>
            <tr><td><input class="txt" name="password2" type="password" placeholder="Repetir nueva contraseña"><br></td></tr>
            <tr><td><span id="resultado1"></span></td></tr>
            <tr><td><br><center><a href="loginClient.html">Volver al login</a></center></td></tr>
        </table>

        <button type="submit">Cambiar contraseña</button>
        <p> </p>
    </form>
    </center>

    <script src="resetPassword.js" type="module"></script>
</body>
</html>
